about:
  content-fork: |
    # About 1Panel Tools Desktop

    This repository packages the existing 1Panel-Tools project as a desktop application with Tauri.

    ## Attribution

    - Original upstream foundation: IT-Tools by Corentin Th
    - 1Panel adaptation: arch3rPro/1Panel-Tools
    - Desktop packaging contributor: ixbaicn

    ## Scope of changes

    This repository mainly adds desktop packaging, build workflow, release workflow, and project attribution updates.

    The existing Docker Compose to 1Panel AppStore feature implementation was not intentionally rewritten as part of this packaging work.
