about:
  content-fork: |
    # 关于 1Panel Tools Desktop

    这个仓库是在现有 1Panel-Tools 项目基础上增加 Tauri 桌面端封装后的版本。

    ## 归属说明

    - 上游基础项目：IT-Tools，原作者 Corentin Th
    - 1Panel 方向改造：arch3rPro/1Panel-Tools
    - 当前桌面端封装贡献者：ixbaicn

    ## 本仓库改动范围

    当前仓库主要增加桌面端封装、构建工作流、发布工作流以及项目归属说明。

    Docker Compose 转 1Panel AppStore 的既有核心功能实现，并未在这次桌面封装工作中被刻意重写。
