name: Release Desktop Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (example: 0.3.1)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: false
        default: ''
        type: string
      release_body:
        description: 'Release notes'
        required: false
        default: 'Automated desktop builds generated by GitHub Actions.'
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      tauri_args:
        description: 'Extra tauri build args'
        required: false
        default: ''
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--release'
          - platform: windows-latest
            args: '--release'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate release-only args
        shell: pwsh
        run: |
          $extraArgs = '${{ inputs.tauri_args }}'
          if ($extraArgs -match '(^|\s)--debug(\s|$)') {
            Write-Error 'Release workflow does not allow --debug. Remove it from tauri_args.'
            exit 1
          }

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: ${{ inputs.release_name != '' && inputs.release_name || format('1Panel Tools Desktop v{0}', inputs.version) }}
          releaseBody: ${{ inputs.release_body }}
          releaseDraft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ format('{0} {1}', matrix.args, inputs.tauri_args) }}
